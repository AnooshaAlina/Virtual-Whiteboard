<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Whiteboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #toolbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;

      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline></video>

  <canvas id="cameraCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>

  <div id="toolbar">
    <button id="clearBtn">CLEAR</button>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const videoElement = document.getElementById("video");

    const cameraCanvas = document.getElementById("cameraCanvas");
    const cameraCtx = cameraCanvas.getContext("2d");

    const drawCanvas = document.getElementById("drawCanvas");
    const drawCtx = drawCanvas.getContext("2d");

    const clearBtn = document.getElementById("clearBtn");

    function resizeCanvas() {
      cameraCanvas.width = window.innerWidth;
      cameraCanvas.height = window.innerHeight;

      drawCanvas.width = window.innerWidth;
      drawCanvas.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    // Clear button
    clearBtn.addEventListener("click", () => {
      drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
      );
    });

    let lastX = null;
    let lastY = null;

    // MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Camera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();

    function onResults(results) {

      // Draw camera feed
      cameraCtx.save();

      cameraCtx.clearRect(
        0,
        0,
        cameraCanvas.width,
        cameraCanvas.height
      );

      cameraCtx.drawImage(
        results.image,
        0,
        0,
        cameraCanvas.width,
        cameraCanvas.height
      );

      cameraCtx.restore();

      // No hand detected
      if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
      ) {
        lastX = null;
        lastY = null;
        return;
      }

      const landmarks = results.multiHandLandmarks[0];

      const indexTip = landmarks[8];
      const thumbTip = landmarks[4];

      const x = indexTip.x * drawCanvas.width;
      const y = indexTip.y * drawCanvas.height;

      // Pinch detection
      const pinchDistance = Math.hypot(
        indexTip.x - thumbTip.x,
        indexTip.y - thumbTip.y
      );

      const isPinching = pinchDistance < 0.05;

      // Draw only when NOT pinching
      if (!isPinching) {

        if (lastX !== null && lastY !== null) {

          drawCtx.strokeStyle = "red";
          drawCtx.lineWidth = 5;
          drawCtx.lineCap = "round";

          drawCtx.beginPath();
          drawCtx.moveTo(lastX, lastY);
          drawCtx.lineTo(x, y);
          drawCtx.stroke();
        }

        lastX = x;
        lastY = y;

      } else {

        lastX = null;
        lastY = null;
      }

      // Cursor
      drawCtx.fillStyle = "cyan";

      drawCtx.beginPath();
      drawCtx.arc(x, y, 10, 0, Math.PI * 2);
      drawCtx.fill();
    }
  </script>

</body>
</html>
