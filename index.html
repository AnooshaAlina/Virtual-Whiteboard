<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Advanced Virtual Whiteboard</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#video {
  position:absolute;
  top:0; left:0;
  width:1280px; height:720px;
  transform: scaleX(-1);
}

#canvas {
  position:absolute;
  top:0; left:0;
  z-index:10;
}

.toolbar {
  position:absolute;
  top:0; left:0;
  height:70px;
  width:1280px;
  background:#111;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px;
}

.btn { padding:6px 10px; background:#333; color:white; border:0; cursor:pointer; }

.color {
  width:18px; height:18px;
  border-radius:50%;
  border:2px solid white;
  cursor:pointer;
}
</style>
</head>

<body>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<div class="toolbar">
  <button class="btn" onclick="undo()">Undo</button>
  <button class="btn" onclick="clearAll()">Clear</button>

  <div class="color" style="background:white" onclick="setColor('white')"></div>
  <div class="color" style="background:black" onclick="setColor('black')"></div>
  <div class="color" style="background:red" onclick="setColor('red')"></div>
  <div class="color" style="background:blue" onclick="setColor('blue')"></div>
  <div class="color" style="background:green" onclick="setColor('green')"></div>

  <button class="btn" onclick="setSize(3)">3</button>
  <button class="btn" onclick="setSize(6)">6</button>
  <button class="btn" onclick="setSize(10)">10</button>
  <button class="btn" onclick="setSize(18)">18</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = 1280;
canvas.height = 720;

let color = "red";
let size = 6;
let mode = "IDLE";

let strokes = [];
let liveStroke = [];
let shapeStart = null;
let prevCursor = null;

function setColor(c){ color = c; }
function setSize(s){ size = s; }

function undo(){
  strokes.pop();
  redraw();
}

function clearAll(){
  strokes = [];
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function dist(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function drawLine(a,b,c,s){
  ctx.strokeStyle = c;
  ctx.lineWidth = s;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let s of strokes){
    if(s.type === "draw"){
      for(let i=1;i<s.pts.length;i++){
        drawLine(s.pts[i-1], s.pts[i], s.color, s.size);
      }
    }
    if(s.type === "rect"){
      const a = s.a, b = s.b;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
    }
  }
}

/* ── MediaPipe Hands ───────────────────────── */

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});

hands.onResults(onResults);

/* ── Gesture logic (RESTORED) ─────────────── */

function isFingerUp(lm, tip, pip){
  return lm[tip].y < lm[pip].y;
}

function onResults(results){
  if(!results.multiHandLandmarks) return;

  const lm = results.multiHandLandmarks[0];

  const index = lm[8];
  const thumb = lm[4];
  const wrist = lm[0];

  const iu = isFingerUp(lm,8,6);
  const mu = isFingerUp(lm,12,10);
  const ru = isFingerUp(lm,16,14);
  const pu = isFingerUp(lm,20,18);

  const openPalm =
    iu && mu && ru && pu &&
    dist(lm[8],wrist) > dist(lm[6],wrist);

  const pinch = dist(index, thumb) < 0.05;

  let cx = index.x * canvas.width;
  let cy = index.y * canvas.height;

  // smoothing (like Python EMA)
  if(prevCursor){
    cx = prevCursor.x*0.6 + cx*0.4;
    cy = prevCursor.y*0.6 + cy*0.4;
  }
  const cursor = {x:cx,y:cy};
  prevCursor = cursor;

  /* ── MODE SYSTEM ── */
  if(openPalm) mode = "ERASE";
  else if(pinch) mode = "SELECT";
  else if(iu && mu) mode = "SHAPE";
  else if(iu) mode = "DRAW";
  else mode = "IDLE";

  /* ── DRAW ── */
  if(mode === "DRAW"){
    if(liveStroke.length === 0){
      liveStroke = [];
      strokes.push({
        type:"draw",
        pts: liveStroke,
        color,
        size
      });
    }
    liveStroke.push(cursor);

    if(liveStroke.length > 1){
      drawLine(
        liveStroke[liveStroke.length-2],
        liveStroke[liveStroke.length-1],
        color,
        size
      );
    }
  }

  /* ── ERASE ── */
  if(mode === "ERASE"){
    ctx.clearRect(cursor.x-30,cursor.y-30,60,60);
  }

  /* ── SHAPE ── */
  if(mode === "SHAPE"){
    if(!shapeStart) shapeStart = cursor;
  } else {
    if(shapeStart){
      strokes.push({
        type:"rect",
        a: shapeStart,
        b: cursor,
        color,
        size
      });
      shapeStart = null;
    }
  }

  if(mode !== "DRAW"){
    liveStroke = [];
  }
}

/* ── Camera ─────────────────────────────── */

const camera = new Camera(video,{
  onFrame: async () => {
    await hands.send({image: video});
  },
  width:1280,
  height:720
});

camera.start();
</script>

</body>
</html>
